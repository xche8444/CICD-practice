name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Test with coverage
        run: pytest -v --cov=app --cov-fail-under=80

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/xche8444/cicd-practice:latest
            ghcr.io/xche8444/cicd-practice:${{ github.sha }}

  ecr:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Get temporary AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/cicd-practice:latest
            ${{ steps.ecr.outputs.registry }}/cicd-practice:${{ github.sha }}

  deploy:
    needs: ecr
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get temporary AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to EC2 via SSM
        env:
          REGION: ${{ vars.AWS_REGION }}
          IID: ${{ vars.EC2_INSTANCE_ID }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="$ACCOUNT.dkr.ecr.$REGION.amazonaws.com"
          IMAGE="$REGISTRY/cicd-practice:$SHA"

          jq -n --arg reg "$REGISTRY" --arg img "$IMAGE" --arg region "$REGION" '{commands: [
            "set -e",
            "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($reg)",
            "docker pull \($img)",
            "docker rm -f app || true",
            "docker run -d --restart unless-stopped -p 8000:8000 --name app \($img)",
            "sleep 3",
            "curl -fsS localhost:8000/add/2/3"
          ]}' > params.json

          CMD_ID=$(aws ssm send-command --instance-ids "$IID" \
            --document-name AWS-RunShellScript --comment "deploy $SHA" \
            --parameters file://params.json --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          sleep 5
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$IID" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" \
            --query '[Status, StandardOutputContent, StandardErrorContent]' --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" \
            --query Status --output text)
          test "$STATUS" = "Success"
